name: portal-prace

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./Database/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U portal -d portal']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Portal.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      CONNECTIONSTRINGS__PORTAL: Host=db;Database=portal;Username=portal;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT__ISSUER: Portal.Api
      JWT__AUDIENCE: Portal.Clients
      JWT__SIGNINGKEY: ${JWT__SIGNINGKEY:?Set JWT__SIGNINGKEY in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Portal.Web/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
